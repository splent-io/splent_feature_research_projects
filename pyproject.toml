[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_research_projects"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env, and
# requires.features_manual (dependencies invisible to static analysis).
[tool.splent.contract]
description = "Research projects extending projects with academic metadata"
archetype = "full"

[tool.splent.contract.provides]
routes     = []
blueprints = []
models     = []
commands   = ["hello"]
hooks      = ["layout.authenticated_sidebar", "layout.scripts"]
services   = ["ResearchProjectsService"]
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = ["projects"]
env_vars = []
signals  = []

[tool.splent.contract.extensible]
services  = ["ResearchProjectsService"]
templates = ["projects/admin/form.html", "projects/admin/list.html", "projects/detail.html", "projects/list.html", "research_projects/index.html"]
models    = []
hooks     = ["layout.authenticated_sidebar", "layout.scripts"]
routes    = false

[tool.splent.refinement]
refines = "splent_feature_projects"

[tool.splent.refinement.extends]
models = [{ target = "Project", mixin = "ResearchProjectMixin" }]

[tool.splent.refinement.overrides]
templates = [
    { target = "projects/list.html" },
    { target = "projects/detail.html" },
    { target = "projects/admin/list.html" },
    { target = "projects/admin/form.html" },
]
