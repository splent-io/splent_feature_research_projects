[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_research_projects"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract ──────────────────────────────────────────────────────────
# Declares what this feature provides to and requires from the product.
# Used by `splent feature:check` and `splent product:derive` for validation.
[tool.splent.contract]
description = "research_projects feature"

[tool.splent.contract.provides]
# Routes exposed by this feature
routes = ["/research_projects"]
# Blueprint names registered into Flask
blueprints = ["research_projects_bp"]
# SQLAlchemy models introduced by this feature
models = []
# CLI commands added by this feature
commands = []

[tool.splent.contract.requires]
# Other SPLENT features this feature depends on (e.g. ["auth", "mail"])
features = ["projects"]
# Environment variables this feature expects to be set
env_vars = []

# ── Extension points ──────────────────────────────────────────────────────────
# Declares what other features can override or extend via refinement.
# See: splent feature:xray
[tool.splent.contract.extensible]
services = []
templates = []
models = []
hooks = []
routes = false

# ── Refinement ────────────────────────────────────────────────────────────────
# This feature refines the base 'projects' feature: it extends the Project
# model with research-specific fields (and overrides the projects templates).
[tool.splent.refinement]
refines = "splent_feature_projects"

[tool.splent.refinement.extends]
models = [{ target = "Project", mixin = "ResearchProjectMixin" }]

[tool.splent.refinement.overrides]
templates = [
    { target = "projects/list.html" },
    { target = "projects/detail.html" },
    { target = "projects/admin/list.html" },
    { target = "projects/admin/form.html" },
]
