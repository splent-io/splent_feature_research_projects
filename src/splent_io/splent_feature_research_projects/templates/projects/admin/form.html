{% extends "base_template.html" %}

{% block title %}{{ 'Edit project' if project else 'Add project' }}{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-start gap-2 mb-4">
    <h1 class="h3 mb-0">{{ 'Edit project' if project else 'Add project' }}</h1>
    <a href="{{ url_for('projects.admin_index') }}" class="btn btn-outline-secondary">← Back to projects</a>
</div>

<form method="POST" class="card">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Title *</label>
                <input name="title" class="form-control" required value="{{ project.title if project else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Acronym</label>
                <input name="acronym" class="form-control" value="{{ project.acronym if project else '' }}" placeholder="e.g. SPLENT">
            </div>
            <div class="col-12">
                <label class="form-label">Summary</label>
                <textarea name="summary" class="form-control" rows="2">{{ project.summary if project else '' }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Description <span class="text-muted">(rich text / HTML)</span></label>
                <textarea name="description" class="form-control" rows="5">{{ project.description if project else '' }}</textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="active" {{ 'selected' if (project and project.status == 'active') or not project else '' }}>active</option>
                    <option value="past" {{ 'selected' if project and project.status == 'past' else '' }}>past</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="coordinator" {{ 'selected' if project and project.role == 'coordinator' else '' }}>coordinator</option>
                    <option value="partner" {{ 'selected' if project and project.role == 'partner' else '' }}>partner</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Principal investigator</label>
                <input name="principal_investigator" class="form-control" value="{{ project.principal_investigator if project else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Funding agency</label>
                <input name="funding_agency" class="form-control" value="{{ project.funding_agency if project else '' }}" placeholder="e.g. European Commission">
            </div>
            <div class="col-md-6">
                <label class="form-label">Programme</label>
                <input name="programme" class="form-control" value="{{ project.programme if project else '' }}" placeholder="e.g. Horizon Europe">
            </div>
            <div class="col-md-6">
                <label class="form-label">Reference</label>
                <input name="reference" class="form-control" value="{{ project.reference if project else '' }}" placeholder="e.g. GA-101000000">
            </div>
            <div class="col-md-6">
                <label class="form-label">Budget</label>
                <input name="budget" class="form-control" value="{{ project.budget if project else '' }}" placeholder="e.g. 1,200,000 €">
            </div>
            <div class="col-md-6">
                <label class="form-label">Partners</label>
                <textarea name="partners" class="form-control" rows="2">{{ project.partners if project else '' }}</textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label">Start date</label>
                <input name="start_date" type="date" class="form-control" value="{{ project.start_date.isoformat() if project and project.start_date else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">End date</label>
                <input name="end_date" type="date" class="form-control" value="{{ project.end_date.isoformat() if project and project.end_date else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Link</label>
                <input name="link" type="url" class="form-control" value="{{ project.link if project else '' }}" placeholder="https://...">
            </div>
            <div class="col-md-6">
                <label class="form-label">Image URL</label>
                <input name="image" class="form-control" value="{{ project.image if project else '' }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Order</label>
                <input name="order" type="number" class="form-control" value="{{ project.order if project else 0 }}">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="published" id="published" {{ 'checked' if (project.published if project else True) else '' }}>
                    <label class="form-check-label" for="published">Published</label>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer text-end">
        <a href="{{ url_for('projects.admin_index') }}" class="btn btn-link text-muted">Cancel</a>
        <button class="btn btn-primary" type="submit">{{ 'Save changes' if project else 'Add project' }}</button>
    </div>
</form>
{% endblock %}
